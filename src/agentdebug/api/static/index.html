      var rootEvent = eventMap[report.root_cause_event_id];
      body = '<div class="root-grid">'
        + kv('事件 ID', report.root_cause_event_id, true)
        + kv('Agent', report.root_cause_agent)
        + kv('Step', report.root_cause_step_index == null ? '—' : '#' + report.root_cause_step_index)
        + kv('根因类型', info.label)
        + '</div>';
      if (rootEvent) {
        body += '<div class="root-snippet"><div class="label">事件摘要</div>'
          + '<div class="text-block">' + escapeHtml(eventSnippet(rootEvent) || '（无摘要）') + '</div></div>';
      }
    } else {
      body = '<div class="empty-state">'
        + (noFailure
          ? '归因模型认为任务最终已恢复，未选择根因；检测发现仅作为改进参考。'
          : (metadata.attribution_skipped
            ? '结果信号判定为正常运行，未选择根因。'
            : '没有找到达到置信度阈值的根因发现。'))
        + '</div>';
    }
    return panel('根因定位', '<span class="badge ' + info.className + '">' + info.label + '</span>', body);
  }

  function renderFindingsSection(findings) {
    var body = findings.length
      ? '<div class="finding-list">' + findings.map(findingHtml).join('') + '</div>'
      : '<div class="empty-state">没有检测到失败模式。</div>';
    return panel('检测发现', '<span class="badge badge-gray">' + findings.length + ' 条</span>', body);
  }

  function findingHtml(finding) {
    var fm = finding.failure_mode || {};
    var metadata = finding.metadata || {};
    var name = fm.name_zh || fm.name || fm.mode_id || '未知失败模式';
    var confidence = confidenceOf(finding);
    var below = Boolean(metadata.below_threshold);
    var evidence = Array.isArray(finding.evidence) ? finding.evidence : [];
    var zhSuggestions = Array.isArray(fm.suggestion_templates_zh) ? fm.suggestion_templates_zh : [];
    var suggestion = zhSuggestions.length ? zhSuggestions[0] : (finding.suggestion || '');
    var suggestionBlocks = zhSuggestions.length > 1
      ? '<div class="label">其他建议</div><ul class="evidence">' + zhSuggestions.slice(1).map(function (item) {
          return '<li><div class="suggestion">' + escapeHtml(item) + '</div></li>';
        }).join('') + '</ul>'
      : '';
    return '<article class="finding-card' + (below ? ' below-threshold' : '') + '">'
      + '<div class="finding-head"><div><span class="finding-name">' + escapeHtml(name) + '</span> '
      + '<span class="badge badge-gray mono">' + escapeHtml(fm.mode_id || '') + '</span>'
      + (below ? ' <span class="badge badge-amber">低于阈值</span>' : '') + '</div>'
      + '<span class="confidence">' + percent(confidence) + '</span></div>'
      + '<div class="confidence-bar"><span style="width:' + (confidence * 100).toFixed(1) + '%"></span></div>'
      + '<div class="finding-meta"><span>step ' + escapeHtml(finding.step_index == null ? '—' : finding.step_index) + '</span>'
      + '<span>agent ' + escapeHtml(finding.agent_name || '—') + '</span>'
      + '<span class="mono">' + escapeHtml(finding.event_id || '—') + '</span></div>'
      + '<div class="label">证据</div>'
      + (evidence.length
        ? '<ul class="evidence">' + evidence.map(function (item) {
            return '<li><pre class="evidence-pre">' + escapeHtml(textValue(item)) + '</pre></li>';
          }).join('') + '</ul>'
        : '<div class="muted">—</div>')
      + (suggestion ? '<div class="label">建议</div><div class="suggestion">' + escapeHtml(suggestion) + '</div>' : '')
      + suggestionBlocks
      + '<details class="details"><summary>判定依据</summary><pre>'
      + escapeHtml(JSON.stringify(metadata, null, 2)) + '</pre></details>'
      + '</article>';
  }

  function hypothesisHtml(hypothesis, roleLabel) {
    hypothesis = hypothesis || {};
    var hasLocation = hypothesis.span_id || hypothesis.step_index != null || hypothesis.agent_name;
    var location = hasLocation
      ? [hypothesis.agent_name ? 'agent ' + hypothesis.agent_name : null,
         hypothesis.step_index != null ? 'step ' + hypothesis.step_index : null,
         hypothesis.span_id ? 'span ' + hypothesis.span_id : null].filter(Boolean).join(' · ')
      : '未定位到具体步骤';
    var evidence = Array.isArray(hypothesis.evidence) ? hypothesis.evidence : [];
    var sources = Array.isArray(hypothesis.sources) ? hypothesis.sources : [];
    var corrected = hypothesis.corrected_action;
    var correctedHtml = '';
    if (corrected && typeof corrected === 'object') {
      correctedHtml = '<div class="label">修正动作</div><div class="kv-grid">'
        + kv('原始动作', corrected.emitted, true)
        + kv('建议动作', corrected.requested, true)
        + kv('原因', corrected.reason)
        + '</div>';
    }
    return '<article class="hypothesis">'
      + '<div class="hypothesis-head"><span class="hypothesis-role">' + escapeHtml(roleLabel) + '</span>'
      + '<span class="confidence">' + percent(hypothesis.confidence) + '</span>'
      + (sources.length ? sources.map(function (source) { return chip('violet', source); }).join('') : '')
      + '</div>'
      + '<div class="muted mono" style="font-size:10px;margin-bottom:5px">' + escapeHtml(location) + '</div>'
      + '<div class="rationale">' + escapeHtml(hypothesis.rationale || '（无归因说明）') + '</div>'
      + (evidence.length ? '<div class="label">证据</div><ul class="evidence">' + evidence.map(function (item) {
          return '<li><pre class="evidence-pre">' + escapeHtml(textValue(item)) + '</pre></li>';
        }).join('') + '</ul>' : '')
      + correctedHtml
      + '</article>';
  }

  function renderAttributionSection(attribution, metadata) {
    attribution = attribution || {};
    if (attribution.method === 'skipped' || (metadata && metadata.attribution_skipped)) {
      return panel('归因', '<span class="badge badge-green">已跳过</span>',
        '<div class="callout green">结果信号正常且没有可信发现，未调用归因模型。</div>');
    }
    var primary = attribution.primary;
    var hypotheses = Array.isArray(attribution.hypotheses) ? attribution.hypotheses : [];
    var raw = attribution.raw || {};
    var body = '';
    if (raw.no_failure) {
      body += '<div class="callout green"><strong>归因模型判定：未发生导致任务失败的错误。</strong>'
        + (raw.no_failure_rationale ? '<br>' + escapeHtml(raw.no_failure_rationale) : '') + '</div>';
    }
    if (primary) {
      body += hypothesisHtml(primary, '主要归因');
    } else if (!raw.no_failure) {
      body += '<div class="empty-state">归因模型未给出有效步骤。</div>';
    }
    if (hypotheses.length > 1) {
      body += '<div class="label">全部假设</div><div class="hypothesis-list">'
        + hypotheses.map(function (item) { return hypothesisHtml(item, '假设'); }).join('') + '</div>';
    }
    if (raw.finding_count != null) {
      body += '<div class="raw-line">参与归因的发现：' + escapeHtml(raw.finding_count) + '</div>';
    }
    return panel('归因', '<span class="badge badge-blue mono">' + escapeHtml(attribution.method || 'all_at_once') + '</span>', body);
  }

  function renderRecoverySection(recovery) {
    recovery = recovery || {};
    var proposals = Array.isArray(recovery.proposals) ? recovery.proposals : [];
    if (!proposals.length) {
      return panel('恢复建议', '<span class="badge badge-gray">0 条</span>',
        '<div class="empty-state">没有生成恢复建议。</div>');
    }
    var body = proposals.map(function (proposal, index) {
      var sideEffects = Array.isArray(proposal.side_effects) ? proposal.side_effects : [];
      return '<article class="proposal"><div class="proposal-head">'
        + '<span class="proposal-index">#' + (index + 1) + '</span>'
        + chip('blue', proposal.recoverer_id || 'recoverer')
        + (proposal.requires_human_approval ? '<span class="badge badge-amber">需要人工确认</span>' : '')
        + '</div><div class="proposal-summary">' + escapeHtml(proposal.summary || '') + '</div>'
        + '<div class="label">建议文本</div><pre class="code-block">' + escapeHtml(proposal.suggestion_text || '（空）') + '</pre>'
        + (sideEffects.length ? '<div class="raw-line">副作用：' + escapeHtml(sideEffects.join(', ')) + '</div>' : '')
        + '</article>';
    }).join('');
    return panel('恢复建议', '<span class="badge badge-violet">' + proposals.length + ' 条</span>', body);
  }

  // ---- events / init ----------------------------------------------------

  els.search.addEventListener('input', renderSessionList);
  els.refresh.addEventListener('click', function () {
    loadHealth();
    loadSessions();
  });
  els.diagnose.addEventListener('click', startDiagnosis);
  els.viewTabs.addEventListener('click', function (event) {
    var tab = event.target.closest('[data-view]');
    if (!tab) return;
    state.viewPinned = true;
    setActiveView(tab.getAttribute('data-view'));
  });
  els.report.addEventListener('click', function (event) {
    if (event.target.closest('[data-start-diagnosis]')) startDiagnosis();
  });
  els.sessionList.addEventListener('click', function (event) {
    var button = event.target.closest('[data-session-id]');
    if (button) selectSession(button.getAttribute('data-session-id'));
  });
  els.sessionDetail.addEventListener('click', function (event) {
    var node = event.target.closest('.trace-node[data-trace-index]');
    if (node) {
      focusTraceEvent(Number(node.getAttribute('data-trace-index')));
      return;
    }
    var action = event.target.closest('[data-timeline-action]');
    if (!action) return;
    var open = action.getAttribute('data-timeline-action') === 'expand';
    els.sessionDetail.querySelectorAll('.timeline details.content-details').forEach(function (details) {
      details.open = open;
    });
  });
  function traceIndexFromEvent(event) {
    var node = event.target.closest ? event.target.closest('.trace-node[data-trace-index]') : null;
    return node ? Number(node.getAttribute('data-trace-index')) : null;
  }
  els.sessionDetail.addEventListener('mouseover', function (event) {
    var index = traceIndexFromEvent(event);
    if (index != null) updateTraceDetail(index);
  });
  els.sessionDetail.addEventListener('mouseout', function (event) {
    if (traceIndexFromEvent(event) != null) resetTraceDetail();
  });
  els.sessionDetail.addEventListener('focusin', function (event) {
    var index = traceIndexFromEvent(event);
    if (index != null) updateTraceDetail(index);
  });
  els.sessionDetail.addEventListener('focusout', function (event) {
    if (traceIndexFromEvent(event) != null) resetTraceDetail();
  });

  loadHealth();
  loadSessions();
})();
</script>
</body>
</html>
